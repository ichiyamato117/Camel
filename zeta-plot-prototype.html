<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>キャラチャット試作品</title>
<style>
:root {
  --bg: #0e0e16;
  --surface: #1a1a28;
  --accent: #4a90e2;
  --accent-soft: #6bb3ff;
  --text: #f0f0f5;
  --muted: #8a8aa0;
  --chat-bg: #2a2848;
  --user-bg: #3b7dd8;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; overflow: hidden; }
.app { height: 100%; max-width: 480px; margin: 0 auto; position: relative; display: flex; flex-direction: column; }
.screen { display: none; height: 100%; flex-direction: column; }
.screen.active { display: flex; }

/* Home / Matching */
.home-header { padding: 16px; background: #161622; border-bottom: 1px solid #2a2a3e; display: flex; justify-content: space-between; align-items: center; }
.home-header h1 { font-size: 1.2rem; }
.card-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.char-card {
  background: #1e1e2e; border-radius: 16px; overflow: hidden; cursor: pointer;
  display: flex; gap: 12px; padding: 12px; align-items: center;
}
.char-card img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
.char-card .info { flex: 1; }
.char-card .name { font-weight: 600; font-size: 1.05rem; }
.char-card .desc { font-size: 0.8rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.add-btn {
  position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
  background: var(--accent); border-radius: 50%; border: none; color: white;
  font-size: 1.8rem; box-shadow: 0 4px 16px rgba(0,0,0,0.3); cursor: pointer;
  z-index: 20;
}

/* Chat */
.chat-header { background: #161622; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2a2a3e; }
.chat-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.chat-header .back { background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; }
.chat { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.message { max-width: 82%; padding: 10px 14px; border-radius: 18px; line-height: 1.55; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
.message.char { background: var(--chat-bg); align-self: flex-start; border-bottom-left-radius: 6px; }
.message.user { background: var(--user-bg); color: white; align-self: flex-end; border-bottom-right-radius: 6px; }
.message.system { background: transparent; color: var(--muted); align-self: center; font-size: 0.78rem; text-align: center; max-width: 92%; border: 1px dashed #3a3a55; padding: 7px 12px; border-radius: 12px; }
.message.char .narrative { color: #a0a0b8; font-style: italic; }
.input-area { background: #161622; padding: 10px 12px calc(10px + var(--safe-bottom)); display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid #2a2a3e; }
textarea { flex: 1; background: #252538; border: 1px solid #3a3a55; border-radius: 20px; padding: 10px 16px; color: var(--text); font-size: 1rem; font-family: inherit; resize: none; outline: none; max-height: 120px; }
.send-btn { background: var(--accent); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }

/* Create / Edit */
.form-screen { padding: 16px; overflow-y: auto; }
.form-screen h2 { margin-bottom: 16px; }
label { display: block; font-size: 0.8rem; color: #aaa; margin: 12px 0 4px; }
input[type="text"], textarea.form {
  width: 100%; background: #252540; border: 1px solid #3a3a55; border-radius: 8px; padding: 10px; color: var(--text); font-size: 0.9rem;
}
textarea.form { min-height: 80px; resize: vertical; }
.btn-row { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); color: white; }
.btn.secondary { background: #2a2a40; color: var(--text); }

/* Settings drawer for API */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 88vw); background: #1a1a28; z-index: 100; transform: translateX(100%); transition: transform 0.28s; overflow-y: auto; padding: 20px 16px 40px; }
.drawer.open { transform: translateX(0); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; display: none; }
.overlay.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <!-- Home -->
  <div class="screen active" id="home">
    <div class="home-header">
      <h1>キャラを選ぶ</h1>
      <button onclick="toggleDrawer()" style="background:none;border:none;color:#aaa;font-size:1.3rem;">⚙️</button>
    </div>
    <div class="card-list" id="card-list"></div>
    <button class="add-btn" onclick="showCreate()">＋</button>
  </div>

  <!-- Chat -->
  <div class="screen" id="chat-screen">
    <div class="chat-header">
      <button class="back" onclick="showHome()">←</button>
      <img id="chat-avatar" src="" alt="">
      <div style="flex:1;">
        <div id="chat-name" style="font-weight:600;"></div>
        <div id="chat-role" style="font-size:0.75rem;color:#8a8aa0;"></div>
      </div>
      <button onclick="toggleChatMenu()" style="background:none;border:none;color:#aaa;font-size:1.4rem;">⋮</button>
    </div>
    <div id="chat-menu" style="display:none;position:absolute;top:60px;right:16px;background:#1e1e2e;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:50;min-width:140px;">
      <button onclick="editCurrentChar()" style="display:block;width:100%;text-align:left;background:none;border:none;color:#f0f0f5;padding:12px 16px;font-size:0.9rem;">キャラを編集</button>
      <button onclick="toggleProfile()" style="display:block;width:100%;text-align:left;background:none;border:none;color:#f0f0f5;padding:12px 16px;font-size:0.9rem;border-top:1px solid #2a2a3e;">プロフィール編集</button>
      <button onclick="clearHistory()" style="display:block;width:100%;text-align:left;background:none;border:none;color:#f0f0f5;padding:12px 16px;font-size:0.9rem;border-top:1px solid #2a2a3e;">履歴を削除</button>
    </div>
    <div class="goal-bar" id="goal-bar" style="display:none;background:#1e1e2e;padding:8px 16px;font-size:0.78rem;color:#c8c8e0;border-bottom:1px solid #2a2a3e;display:flex;justify-content:space-between;align-items:center;">
      <div><strong style="color:#9b8cff;">目標</strong> <span id="current-goal-text"></span></div>
      <button onclick="advanceGoal()" style="background:#3a3a55;color:#ccc;border:none;border-radius:6px;padding:4px 8px;font-size:0.7rem;">次へ</button>
    </div>
    <div id="profile-section" style="background:#161622;padding:8px 14px;border-bottom:1px solid #2a2a3e;font-size:0.8rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span style="color:#8a8aa0;">あなたのプロフィール（{{user}}）</span>
        <button onclick="toggleProfile()" style="background:none;border:none;color:#aaa;font-size:0.75rem;">閉じる</button>
      </div>
      <div id="profile-content">
        <div style="margin-bottom:6px;">
          <div style="color:#8a8aa0;font-size:0.75rem;">呼ばれる名前</div>
          <input type="text" id="chat-user-name" placeholder="例: あなた" style="width:100%;background:#252538;border:1px solid #3a3a55;border-radius:8px;padding:6px 8px;color:#f0f0f5;font-size:0.85rem;">
        </div>
        <textarea id="chat-user-profile" rows="2" style="width:100%;background:#252538;border:1px solid #3a3a55;border-radius:8px;padding:6px 8px;color:#f0f0f5;font-size:0.85rem;resize:vertical;" placeholder="例: 少し気さくな書庫番。"></textarea>
        <button onclick="saveUserProfile()" style="margin-top:4px;background:#3a3a55;color:#ccc;border:none;border-radius:6px;padding:4px 10px;font-size:0.75rem;">プロフィールを保存</button>
      </div>
    </div>
    <div class="chat" id="chat" oncontextmenu="return false;" ontouchstart="startLongPress()" ontouchend="cancelLongPress()" onmousedown="startLongPress()" onmouseup="cancelLongPress()"></div>
    <div class="input-area">
      <textarea id="user-input" rows="1" placeholder="話しかける..." oninput="autoResize(this)" onkeypress="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <button class="send-btn" onclick="send()">➤</button>
    </div>
  </div>

  <!-- Create -->
  <div class="screen" id="create-screen">
    <div class="form-screen">
      <h2>新しいキャラを作る</h2>
      <label>写真</label>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <img id="avatar-preview" src="" style="width:64px;height:64px;border-radius:12px;object-fit:cover;background:#252538;display:none;">
        <label style="width:48px;height:48px;border-radius:12px;background:#252538;border:2px dashed #555;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#aaa;cursor:pointer;">
          ＋
          <input type="file" id="avatar-file" accept="image/*" style="display:none;" onchange="previewAvatar(this)">
        </label>
      </div>
      <input type="text" id="new-name" placeholder="例: ルシアン">
      <label>一言説明</label>
      <input type="text" id="new-short" placeholder="例: 呪われた王子">
      <label>呼ばれる名前（{{user}}）</label>
      <input type="text" id="new-user-name" placeholder="例: あなた、または名前">
      <label>会話開始の定型文</label>
      <textarea class="form" id="new-opening" placeholder="例: ……また新しい世話係か。"></textarea>
      <textarea class="form" id="new-profile" placeholder="ぶっきらぼうで他人行儀。本心では人を求めている…"></textarea>
      <label>世界観・関係性</label>
      <textarea class="form" id="new-world" placeholder="プレイヤーは新任の世話係。塔の一室で孤独に過ごしている。"></textarea>
      <label>ストーリープロット（任意・目標を改行で）</label>
      <textarea class="form" id="new-plot" placeholder="例:&#10;最初の会話をする&#10;侍女から噂を聞く&#10;本の話をして心を開かせる&#10;体調を気遣う"></textarea>
      <button class="btn secondary" style="margin-top:8px;width:100%;" onclick="generatePlot()">AIでプロットを自動生成</button>
      <div class="btn-row">
        <button class="btn secondary" onclick="showHome()">キャンセル</button>
        <button class="btn primary" onclick="saveNewChar()">作成</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <strong>API設定</strong>
    <button onclick="toggleDrawer()" style="background:none;border:none;color:#aaa;font-size:1.4rem;">✕</button>
  </div>
  <label>プロバイダ</label>
  <select id="provider" onchange="applyProvider()" style="width:100%;background:#252540;border:1px solid #3a3a55;border-radius:8px;padding:8px;color:#f0f0f5;">
    <option value="groq">Groq（無料）</option>
    <option value="openrouter">OpenRouter（無料モデル）</option>
    <option value="custom">カスタム</option>
  </select>
  <label>APIキー</label>
  <input type="password" id="api-key" placeholder="キーを貼り付け" style="width:100%;background:#252540;border:1px solid #3a3a55;border-radius:8px;padding:8px;color:#f0f0f5;">
  <div class="small" id="key-help" style="font-size:0.75rem;color:#888;margin-top:4px;">Groq: console.groq.com で無料取得</div>
  <label>モデル</label>
  <input type="text" id="model" value="openai/gpt-oss-120b" style="width:100%;background:#252540;border:1px solid #3a3a55;border-radius:8px;padding:8px;color:#f0f0f5;">
  <label>エンドポイント</label>
  <input type="text" id="endpoint" value="https://api.groq.com/openai/v1/chat/completions" style="width:100%;background:#252540;border:1px solid #3a3a55;border-radius:8px;padding:8px;color:#f0f0f5;">
  <button class="btn primary" style="margin-top:16px;width:100%;" onclick="saveApiSettings()">保存</button>
  <button class="btn secondary" style="margin-top:10px;width:100%;" onclick="resetAll()">すべてのデータをリセット</button>
  <div id="status-msg" style="font-size:0.8rem;color:#9b8cff;margin-top:8px;"></div>
</div>

      '塔の部屋で王子と最初の会話をする',
      '侍女ミナから城の噂を聞く',
      '本の話をして心を開かせる',
      '体調の悪さに気づき気遣う'
    ],
    currentGoal: 0,
    messages: []
  }
];

let currentChar = null;

function saveChars() { localStorage.setItem('zeta_chars', JSON.stringify(characters)); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showHome() {
  renderCards();
  showScreen('home');
  history.pushState({ screen: 'home' }, '', '#home');
}

function openChat(id) {
  currentChar = characters.find(c => c.id === id);
  if (!currentChar) return;
  document.getElementById('chat-avatar').src = currentChar.avatar;
  document.getElementById('chat-name').textContent = currentChar.name;
  document.getElementById('chat-role').textContent = currentChar.short;
  updateGoalBar();
  document.getElementById('chat-user-profile').value = currentChar.userProfile || '';
  document.getElementById('chat-user-name').value = currentChar.userName || '';
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  if (currentChar.messages.length === 0) {
    if (currentChar.opening) {
      addMessage(currentChar.opening, 'char');
    } else {
      addMessage(`${currentChar.name}がこちらを見ている。`, 'system');
    }
  } else {
    currentChar.messages.forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'char'));
  }
  showScreen('chat-screen');
  history.pushState({ screen: 'chat', id: id }, '', '#chat');
}

let pendingAvatar = null;

function previewAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    pendingAvatar = e.target.result;
    const preview = document.getElementById('avatar-preview');
    preview.src = pendingAvatar;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

let editingId = null;

function editChar(id) {
  const c = characters.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  document.getElementById('new-name').value = c.name;
  document.getElementById('new-short').value = c.short;
  document.getElementById('new-profile').value = c.profile;
  document.getElementById('new-world').value = c.world;
  document.getElementById('new-user-name').value = c.userName || '';
  document.getElementById('new-opening').value = c.opening || '';
  document.getElementById('new-plot').value = (c.plot || []).join('\n');
  if (c.avatar && c.avatar !== AVATAR) {
    pendingAvatar = c.avatar;
    const preview = document.getElementById('avatar-preview');
    preview.src = c.avatar;
    preview.style.display = 'block';
  }
  showCreate();
}

function showCreate() { 
  showScreen('create-screen'); 
  history.pushState({ screen: 'create' }, '', '#create');
}

window.addEventListener('popstate', (e) => {
  if (!e.state || e.state.screen === 'home') {
    renderCards();
    showScreen('home');
  } else if (e.state.screen === 'chat' && e.state.id) {
    openChat(e.state.id);
  } else if (e.state.screen === 'create') {
    showScreen('create-screen');
  }
});

function renderCards() {
  const list = document.getElementById('card-list');
  list.innerHTML = characters.map(c => `
    <div class="char-card" style="position:relative;">
      <div onclick="openChat('${c.id}')" style="display:flex;gap:12px;align-items:center;flex:1;cursor:pointer;">
        <img src="${c.avatar}" alt="">
        <div class="info">
          <div class="name">${c.name}</div>
          <div class="desc">${c.short}</div>
        </div>
      </div>
      <button onclick="editChar('${c.id}')" style="background:#3a3a55;color:#ccc;border:none;border-radius:8px;padding:6px 10px;font-size:0.75rem;">編集</button>
    </div>
  `).join('');
}

async function generatePlot() {
  const name = document.getElementById('new-name').value.trim();
  const profile = document.getElementById('new-profile').value.trim();
  const world = document.getElementById('new-world').value.trim();
  if (!name && !profile) {
    alert('先に名前か性格を入力してください');
    return;
  }

  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) {
    alert('先に⚙️からAPIキーを設定してください');
    return;
  }

  const btn = event.target;
  const original = btn.textContent;
  btn.textContent = '生成中...';
  btn.disabled = true;

  try {
    const endpoint = document.getElementById('endpoint').value.trim();
    const model = document.getElementById('model').value.trim();
    const prompt = `キャラクター設定から、チャットで進めやすい短い目標リストを作ってください。

名前: ${name || '不明'}
性格: ${profile || '特になし'}
世界観: ${world || '特になし'}

条件：
- 4〜6個の目標
- 各目標は15〜25文字程度
- 1行に1目標、改行のみで区切る
- 最初は会話や関係の始まりから、徐々に深まる・謎や事件が進む流れにする
- 説明文や番号は一切つけない。目標の文章だけを出力する

出力例：
最初の会話をする
相手の本心を少し聞く
一緒に本を読む
体調を気遣う`;

    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model,
        messages: [{ role: 'user', content: prompt }],
        temperature: 0.6,
        max_tokens: 400
      })
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`APIエラー ${res.status}: ${err.slice(0, 200)}`);
    }
    const data = await res.json();
    let text = data.choices?.[0]?.message?.content?.trim() || '';
    if (!text) {
      // 空の場合はレスポンスの一部を見せる
      const debug = JSON.stringify(data).slice(0, 300);
      throw new Error('空の応答です。APIの返答: ' + debug);
    }
    // Clean up
    text = text.replace(/^[0-9０-９]+[\.\、]\s*/gm, '').trim();
    const plotEl = document.getElementById('new-plot');
    if (plotEl) plotEl.value = text;
    else alert('プロット欄が見つかりません');
  } catch (e) {
    alert('生成に失敗しました: ' + e.message);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
}

function saveNewChar() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return alert('名前を入力してください');
  const plotText = document.getElementById('new-plot').value.trim();
  const plot = plotText ? plotText.split('\n').map(s => s.trim()).filter(Boolean) : [];

  if (editingId) {
    const c = characters.find(x => x.id === editingId);
    if (c) {
      c.name = name;
      c.short = document.getElementById('new-short').value.trim() || '新しいキャラ';
      c.profile = document.getElementById('new-profile').value.trim();
      c.world = document.getElementById('new-world').value.trim();
      c.userName = document.getElementById('new-user-name').value.trim() || 'あなた';
      c.opening = document.getElementById('new-opening').value.trim();
      c.plot = plot;
      if (pendingAvatar) c.avatar = pendingAvatar;
    }
    editingId = null;
  } else {
    const char = {
      id: Date.now().toString(),
      name,
      short: document.getElementById('new-short').value.trim() || '新しいキャラ',
      avatar: pendingAvatar || AVATAR,
      profile: document.getElementById('new-profile').value.trim(),
      world: document.getElementById('new-world').value.trim(),
      userProfile: 'あなた',
      userName: document.getElementById('new-user-name').value.trim() || 'あなた',
      opening: document.getElementById('new-opening').value.trim(),
      plot: plot,
      currentGoal: 0,
      messages: []
    };
    characters.push(char);
  }

  saveChars();
  document.getElementById('new-name').value = '';
  document.getElementById('new-short').value = '';
  document.getElementById('new-profile').value = '';
  document.getElementById('new-world').value = '';
  document.getElementById('new-user-name').value = '';
  document.getElementById('new-opening').value = '';
  document.getElementById('new-plot').value = '';
  pendingAvatar = null;
  document.getElementById('avatar-preview').style.display = 'none';
  showHome();
}

function addMessage(text, type) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `message ${type}`;
  if (type === 'char') {
    // *地の文* を薄い文字にし、* を消す
    const escaped = text.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/\n/g,'<br>');
    const html = escaped.replace(/\*([^*]+)\*/g, '<span class="narrative">$1</span>');
    div.innerHTML = html;
  } else {
    div.innerHTML = text.replace(/\n/g, '<br>');
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

let longPressTimer = null;
function startLongPress() {
  longPressTimer = setTimeout(() => {
    clearHistory();
  }, 700);
}
function cancelLongPress() {
  clearTimeout(longPressTimer);
}

function toggleChatMenu() {
  const menu = document.getElementById('chat-menu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

function editCurrentChar() {
  if (currentChar) editChar(currentChar.id);
  document.getElementById('chat-menu').style.display = 'none';
}

function clearHistory() {
  if (!currentChar) return;
  if (confirm('このキャラの会話履歴を削除しますか？')) {
    currentChar.messages = [];
    saveChars();
    openChat(currentChar.id);
  }
  document.getElementById('chat-menu').style.display = 'none';
}

function toggleProfile() {
  const content = document.getElementById('profile-content');
  const btn = event.target;
  if (content.style.display === 'none') {
    content.style.display = 'block';
    btn.textContent = '閉じる';
  } else {
    content.style.display = 'none';
    btn.textContent = '開く';
  }
}

function saveUserProfile() {
  if (!currentChar) return;
  currentChar.userProfile = document.getElementById('chat-user-profile').value.trim();
  currentChar.userName = document.getElementById('chat-user-name').value.trim() || 'あなた';
  saveChars();
  addMessage('あなたのプロフィールを更新しました。', 'system');
}

function advanceGoal() {
  if (!currentChar || !currentChar.plot) return;
  if ((currentChar.currentGoal || 0) < currentChar.plot.length - 1) {
    currentChar.currentGoal = (currentChar.currentGoal || 0) + 1;
    saveChars();
    updateGoalBar();
    addMessage('【目標を進めました】', 'system');
  }
}

function updateGoalBar() {
  const bar = document.getElementById('goal-bar');
  const text = document.getElementById('current-goal-text');
  if (currentChar && currentChar.plot && currentChar.plot.length > 0) {
    const idx = currentChar.currentGoal || 0;
    if (idx < currentChar.plot.length) {
      text.textContent = currentChar.plot[idx];
      bar.style.display = 'block';
    } else {
      text.textContent = '物語の終わり';
      bar.style.display = 'block';
    }
  } else {
    bar.style.display = 'none';
  }
}

function getSystemPrompt() {
  if (!currentChar) return '';
  let goalText = '';
  if (currentChar.plot && currentChar.plot.length > 0) {
    const idx = currentChar.currentGoal || 0;
    const current = currentChar.plot[idx] || '自由な会話';
    const next = currentChar.plot[idx + 1] || 'なし';
    goalText = `
【現在のストーリー目標】
現在の目標：${current}
次の目標：${next}
目標リスト全体：
${currentChar.plot.map((g, i) => `${i+1}. ${g}`).join('\n')}
プレイヤーが現在の目標に沿った行動や会話をしたら、自然に次の展開へ進めてください。無理に急がず、キャラクターらしく。
`;
  }

  return `あなたは以下のキャラクターとしてロールプレイしてください。

【キャラクター】
名前: ${currentChar.name}
${currentChar.profile}

【世界観・関係性】
${currentChar.world}

【相手（ユーザー）のプロフィール】
呼ばれる名前: ${currentChar.userName || 'あなた'}
${currentChar.userProfile}
${goalText}
ルール：
- 上記の設定に厳密に従ってロールプレイすること。
- 返答は少し長めにする。
- 地の文（表情・仕草・視線・周囲の描写など）は必ず *地の文* のように単一のアスタリスクで囲むこと。
- 台詞はアスタリスクの外に書くこと。
- 例: *彼は視線を逸らした。* ……そうか。*月光が彼の影をさらに薄く見せている。*
- 地の文と台詞を自然に織り交ぜること。
- 返答は日本語。
- 現在の目標が会話の中で達成されたと感じたら、返答の最後に必ず [GOAL_DONE] とだけ付けてください。それ以外のときは付けないでください。`;
}

async function send() {
  const input = document.getElementById('user-input');
  let text = input.value.trim();
  const isContinue = !text;

  if (!currentChar) return;

  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) {
    addMessage('APIキーが設定されていません。ホームの⚙️から設定してください。', 'system');
    return;
  }

  const sendBtn = document.querySelector('.send-btn');
  sendBtn.disabled = true;
  sendBtn.style.opacity = '0.6';

  if (!isContinue) {
    addMessage(text, 'user');
    input.value = '';
    autoResize(input);
    currentChar.messages.push({ role: 'user', content: text });
  } else {
    text = '（相手は何も言わずに待っている。自然に会話を続けてください）';
  }

  const typing = addMessage('考え中...', 'char');

  try {
    const endpoint = document.getElementById('endpoint').value.trim();
    const model = document.getElementById('model').value.trim();
    const messages = [
      { role: 'system', content: getSystemPrompt() },
      ...currentChar.messages.slice(-12).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }))
    ];

    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({ model, messages, temperature: 0.85, max_tokens: 700 })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`APIエラー ${res.status}: ${errText.slice(0, 180)}`);
    }
    const data = await res.json();
    const replyRaw = data.choices?.[0]?.message?.content?.trim() || '……';
    const goalDone = replyRaw.includes('[GOAL_DONE]');
    const reply = replyRaw.replace('[GOAL_DONE]', '').trim();

    typing.remove();
    addMessage(reply, 'char');
    currentChar.messages.push({ role: 'assistant', content: reply });

    if (goalDone && currentChar.plot && (currentChar.currentGoal || 0) < currentChar.plot.length - 1) {
      currentChar.currentGoal = (currentChar.currentGoal || 0) + 1;
      updateGoalBar();
      addMessage('【目標を達成しました】', 'system');
    }

    saveChars();
  } catch (e) {
    typing.remove();
    addMessage(`通信エラー: ${e.message}`, 'system');
  } finally {
    sendBtn.disabled = false;
    sendBtn.style.opacity = '1';
  }
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function applyProvider() {
  const p = document.getElementById('provider').value;
  const help = document.getElementById('key-help');
  const endpoint = document.getElementById('endpoint');
  const model = document.getElementById('model');
  if (p === 'groq') {
    endpoint.value = 'https://api.groq.com/openai/v1/chat/completions';
    if (!model.value || model.value.includes('llama')) model.value = 'openai/gpt-oss-120b';
    help.textContent = 'Groq: console.groq.com で無料取得。おすすめ: openai/gpt-oss-120b';
  } else if (p === 'openrouter') {
    endpoint.value = 'https://openrouter.ai/api/v1/chat/completions';
    model.value = 'openrouter/free';
    help.textContent = 'OpenRouter: openrouter.ai でキー取得';
  }
}

function resetAll() {
  if (confirm('すべてのキャラと設定を削除します。よろしいですか？')) {
    localStorage.removeItem('zeta_chars');
    localStorage.removeItem('zeta_api_key');
    localStorage.removeItem('zeta_provider');
    localStorage.removeItem('zeta_model');
    localStorage.removeItem('zeta_endpoint');
    location.reload();
  }
}

function saveApiSettings() {
  localStorage.setItem('zeta_api_key', document.getElementById('api-key').value);
  localStorage.setItem('zeta_provider', document.getElementById('provider').value);
  localStorage.setItem('zeta_model', document.getElementById('model').value);
  localStorage.setItem('zeta_endpoint', document.getElementById('endpoint').value);
  document.getElementById('status-msg').textContent = '保存しました';
  setTimeout(() => document.getElementById('status-msg').textContent = '', 2000);
}

function loadApiSettings() {
  const key = localStorage.getItem('zeta_api_key');
  const provider = localStorage.getItem('zeta_provider') || 'groq';
  const model = localStorage.getItem('zeta_model');
  const endpoint = localStorage.getItem('zeta_endpoint');
  if (key) document.getElementById('api-key').value = key;
  document.getElementById('provider').value = provider;
  if (model) document.getElementById('model').value = model;
  if (endpoint) document.getElementById('endpoint').value = endpoint;
  applyProvider();
}

// keyboard
if (window.visualViewport) {
  const inputArea = document.querySelector('.input-area');
  const chat = document.getElementById('chat');
  const adjust = () => {
    const offset = window.innerHeight - window.visualViewport.height;
    if (inputArea) inputArea.style.paddingBottom = `calc(10px + ${Math.max(offset,0)}px + var(--safe-bottom))`;
    if (chat) chat.scrollTop = chat.scrollHeight;
  };
  window.visualViewport.addEventListener('resize', adjust);
}

loadApiSettings();
renderCards();
</script>
</body>
</html>
